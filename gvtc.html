<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Please log in</title>

  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html {
      -webkit-text-size-adjust: 100%;
      font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        "Helvetica Neue",
        Arial,
        sans-serif;
      line-height: 1.5;
    }

    body {
      margin: 0;
      background: #ffffff;
      color: #1f2a37;
    }

    button,
    input {
      font: inherit;
    }

    /* Page spacing */
    .login-page {
      width: 100%;
      min-height: 100vh;
      min-height: 100svh;
      padding: 20px 16px 32px;
    }

    /* Center the form horizontally without oversized padding. */
    .login-panel {
      display: block;
      width: 100%;
      max-width: 400px;
      margin: 0 auto;
    }

    /* Logo */
    .branding {
      display: flex;
      justify-content: center;
      margin-bottom: 16px;
    }

    .branding img {
      display: block;
      width: auto;
      height: auto;
      max-width: 100%;
      max-height: 90px;
      object-fit: contain;
    }

    h1 {
      margin: 0 0 20px;
      text-align: center;
      font-size: 1.25rem;
      font-weight: 700;
    }

    /* Form */
    #login_form,
    #contact-form {
      width: 100%;
      margin: 0;
      padding: 0;
    }

    .formfield {
      margin-bottom: 18px;
    }

    .formfield label {
      display: block;
      margin-bottom: 6px;
      color: #374151;
      font-size: 0.85rem;
      font-weight: 700;
    }

    .formfield input {
      display: block;
      width: 100%;
      min-width: 0;
      min-height: 44px;
      padding: 10px 12px;
      border: 1px solid #63b3ed;
      border-radius: 6px;
      background: #ffffff;
      color: #1f2a37;
      font-size: 1rem;
      outline: none;
      transition:
        border-color 0.15s,
        box-shadow 0.15s;
    }

    .formfield input:focus {
      border-color: #2b8fd6;
      box-shadow: 0 0 0 3px rgb(99 179 237 / 25%);
    }

    /* Password toggle */
    .password-field {
      position: relative;
    }

    #password-input {
      padding-right: 76px;
    }

    #toggle {
      position: absolute;
      top: 50%;
      right: 8px;
      transform: translateY(-50%);
      min-width: 52px;
      min-height: 32px;
      padding: 4px 6px;
      border: none;
      border-radius: 4px;
      background: transparent;
      color: #1f2a37;
      font-size: 0.8rem;
      text-transform: uppercase;
      cursor: pointer;
    }

    #toggle:hover {
      background: #f1f5f9;
    }

    /* Remember Me */
    .remember-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 4px;
    }

    #remember_me {
      flex-shrink: 0;
      width: 16px;
      height: 16px;
      margin: 0;
      accent-color: #363535;
    }

    .remember-row label {
      color: #374151;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
    }

    .remember-help {
      margin-top: 10px;
      color: #5b6b7c;
      font-size: 0.85rem;
    }

    .remember-help summary {
      width: fit-content;
      text-decoration: underline;
      text-underline-offset: 2px;
      cursor: pointer;
    }

    .remember-help p {
      margin: 8px 0 0;
      padding: 10px 12px;
      border: 1px solid #fde68a;
      border-radius: 6px;
      background: #fef3c7;
      color: #374151;
    }

    /* Submit */
    #submit-btn {
      display: block;
      width: 100%;
      min-height: 48px;
      margin: 20px 0 16px;
      padding: 12px 16px;
      border: none;
      border-radius: 8px;
      background: #363535;
      color: #ffffff;
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      cursor: pointer;
    }

    #submit-btn:hover:not(:disabled) {
      background: #1f1e1e;
    }

    #submit-btn:disabled {
      opacity: 0.65;
      cursor: not-allowed;
    }

    /* Account links */
    #self-care ul {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 8px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    #self-care a {
      color: #5b6b7c;
      font-size: 0.9rem;
      text-decoration: underline;
      text-underline-offset: 2px;
    }

    #self-care a:hover {
      color: #2b8fd6;
    }

    /* Error messages */
    .error-text {
      display: block;
      margin-top: 4px;
      color: #b3261e;
      font-size: 0.75rem;
    }

    .error-text:empty {
      display: none;
    }

    #form-error-banner {
      display: none;
      margin: 12px 0;
      padding: 10px 12px;
      border: 1px solid #f3b8b4;
      border-radius: 6px;
      background: #fdeceb;
      color: #b3261e;
      font-size: 0.85rem;
    }

    #form-error-banner.show {
      display: block;
    }

    button:focus-visible,
    a:focus-visible,
    summary:focus-visible,
    input[type="checkbox"]:focus-visible {
      outline: 2px solid #2b8fd6;
      outline-offset: 3px;
    }

    @media (max-width: 480px) {
      .login-page {
        padding: 12px 16px 24px;
      }

      .branding img {
        width: 100%;
        max-width: 280px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .formfield input {
        transition: none;
      }
    }
  </style>
</head>

<body>
  <main class="login-page">
    <div id="login-view" class="login-panel">
      <header>
        <div class="branding">
          <img
            src="https://i.imghippo.com/files/knqa6398Itw.png"
            alt="Site logo"
          >
        </div>

        <h1>Please log in</h1>
      </header>

      <div
        id="form-error-banner"
        role="alert"
        aria-live="polite"
      ></div>

      <section id="login_form" aria-label="Login">
        <!--
          Layout preview only.
          Connect this form to your own authentication backend.
        -->
        <form id="contact-form" method="post" action="#">
          <div class="formfield">
            <label for="email-input">Username</label>

            <input
              type="text"
              id="email-input"
              name="email"
              placeholder="Username"
              autocomplete="username"
              autocapitalize="none"
              spellcheck="false"
              aria-describedby="email-error"
              required
            >

            <span
              id="email-error"
              class="error-text"
              aria-live="polite"
            ></span>
          </div>

          <div class="formfield">
            <label for="password-input">Password</label>

            <div class="password-field">
              <input
                type="password"
                id="password-input"
                name="password"
                placeholder="Password"
                autocomplete="current-password"
                aria-describedby="password-error"
                required
              >

              <button
                type="button"
                id="toggle"
                aria-label="Show password"
                aria-controls="password-input"
                aria-pressed="false"
              >
                Show
              </button>
            </div>

            <span
              id="password-error"
              class="error-text"
              aria-live="polite"
            ></span>
          </div>

          <div class="remember-row">
            <input
              type="checkbox"
              id="remember_me"
              name="remember_me"
              checked
            >

            <label for="remember_me">Remember Me</label>
          </div>

          <details class="remember-help" id="remember_me_help">
            <summary id="remember_me_help_link">
              About Remember Me
            </summary>

            <p>
              Select this option only on a private device.
              How long you stay signed in depends on the
              application's authentication settings.
            </p>
          </details>

          <button id="submit-btn" type="submit">
            Submit
          </button>
        </form>
      </section>

      <nav id="self-care" aria-label="Account help">
        <ul>
          <li>
            <a id="register" href="#">Need to register?</a>
          </li>
          <li>
            <a id="forgot_password" href="#">Forgot Password?</a>
          </li>
        </ul>
      </nav>
    </div>
  </main>

  <script>
    const passwordInput = document.getElementById("password-input");
    const toggleButton = document.getElementById("toggle");

    toggleButton.addEventListener("click", function () {
      const showPassword = passwordInput.type === "password";

      passwordInput.type = showPassword ? "text" : "password";
      toggleButton.textContent = showPassword ? "Hide" : "Show";

      toggleButton.setAttribute(
        "aria-label",
        showPassword ? "Hide password" : "Show password"
      );

      toggleButton.setAttribute(
        "aria-pressed",
        String(showPassword)
      );
    });

    /* Prevent submission while this is only a layout preview. */
    document.getElementById("contact-form").addEventListener(
      "submit",
      function (event) {
        event.preventDefault();

        const banner = document.getElementById("form-error-banner");
        banner.textContent =
          "Layout preview only. No login request has been sent.";
        banner.classList.add("show");
      }
    );
  </script>
</body>
</html>
