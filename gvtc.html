<style>
  *,
  *::before,
  *::after {
    box-sizing: border-box;
  }

  html {
    -webkit-text-size-adjust: 100%;
    font-family:
      system-ui,
      -apple-system,
      BlinkMacSystemFont,
      "Segoe UI",
      Roboto,
      "Helvetica Neue",
      Arial,
      sans-serif;
    line-height: 1.5;
  }

  body {
    margin: 0;
    background: #fff;
    color: #1f2a37;
  }

  /* Page layout: replaces the original 600px side padding. */
  main.container {
    display: block;
    width: 100%;
    max-width: none;
    min-height: 100vh;
    min-height: 100svh;
    margin: 0;
    padding: 20px 16px 32px;
    background: #fff;
  }

  /* Equivalent to the new .login-panel layout. */
  #login-view {
    width: 100%;
    max-width: 400px;
    margin: 0 auto;
  }

  #login_form,
  #self-care {
    padding-left: 0;
    padding-right: 0;
  }

  /* Branding */
  .branding {
    display: flex;
    justify-content: center;
    margin: 0 0 16px;
  }

  .branding img {
    display: block;
    width: auto;
    height: auto;
    max-width: 100%;
    max-height: 90px;
    object-fit: contain;
  }

  /* Override the existing heading wrapper spacing. */
  #login-view > header > .text-center {
    margin: 0;
  }

  h1 {
    margin: 0 0 12px;
    text-align: center;
    font-size: 1.25rem;
    font-weight: 700;
  }

  .demo-notice {
    margin: 0 0 24px;
    color: #5b6b7c;
    font-size: 0.85rem;
    text-align: center;
  }

  /* Form fields */
  .formfield {
    margin-bottom: 18px;
  }

  .formfield label {
    display: block;
    margin-bottom: 6px;
    color: #374151;
    font-size: 0.85rem;
    font-weight: 700;
  }

  .formfield input[type="text"],
  .formfield input[type="password"] {
    display: block;
    width: 100%;
    min-width: 0;
    min-height: 44px;
    padding: 10px 12px;
    border: 1px solid #63b3ed;
    border-radius: 6px;
    background: #fff;
    color: #1f2a37;
    font: inherit;
    font-size: 1rem;
    outline: none;
    transition:
      border-color 0.15s,
      box-shadow 0.15s;
  }

  .formfield input:focus {
    border-color: #2b8fd6;
    box-shadow: 0 0 0 3px rgb(99 179 237 / 25%);
  }

  /* Leave room for the existing show/hide password button. */
  #password-input {
    padding-right: 72px;
  }

  #toggle {
    border: none;
    padding: 4px 6px;
    background: transparent;
    color: #1f2a37;
    font: inherit;
    font-size: 0.8rem;
    cursor: pointer;
  }

  #toggle:focus-visible {
    outline: 2px solid #2b8fd6;
    outline-offset: 2px;
    border-radius: 3px;
  }

  /* Remember Me: adapted to your existing markup. */
  .remember-me > .flex {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 4px;
  }

  #remember_me {
    flex-shrink: 0;
    width: 16px;
    height: 16px;
    margin: 0;
    accent-color: #363535;
  }

  .remember-me label {
    color: #374151;
    font-size: 0.9rem;
    font-weight: 700;
  }

  #remember_me_help_link {
    margin-left: 0;
    color: #5b6b7c;
    font-size: 0.9rem;
    text-decoration: underline;
    text-underline-offset: 2px;
  }

  /* Submit button */
  #submit-btn {
    display: block;
    width: 100%;
    min-height: 48px;
    margin: 20px 0 16px;
    padding: 12px 16px;
    border: none;
    border-radius: 8px;
    background: #363535;
    color: #fff;
    font: inherit;
    font-size: 1.15rem;
    font-weight: 700;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    cursor: pointer;
  }

  #submit-btn:hover:not(:disabled) {
    background: #1f1e1e;
  }

  #submit-btn:disabled {
    cursor: not-allowed;
    opacity: 0.65;
  }

  /* Self-care links */
  #self-care ul {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 8px;
    margin: 0;
    padding: 0;
    list-style: none;
  }

  #self-care li {
    margin: 0;
  }

  #self-care a {
    color: #5b6b7c;
    font-size: 0.9rem;
    text-decoration: underline;
    text-underline-offset: 2px;
  }

  #self-care a:hover {
    color: #2b8fd6;
  }

  /* Validation messages */
  .error-text {
    display: block;
    min-height: 1em;
    margin-top: 4px;
    color: #b3261e;
    font-size: 0.75rem;
  }

  #form-error-banner {
    display: none;
    margin: 12px 0;
    padding: 10px 12px;
    border: 1px solid #f3b8b4;
    border-radius: 6px;
    background: #fdeceb;
    color: #b3261e;
    font-size: 0.85rem;
  }

  #form-error-banner.show {
    display: block;
  }

  /* Footer */
  #login-view > footer {
    width: 100%;
    margin: 28px auto 0;
    color: #64748b;
    font-size: 0.75rem;
    text-align: center;
  }

  @media (max-width: 480px) {
    main.container {
      padding: 12px 16px 24px;
    }

    .branding img {
      width: 100%;
      max-width: 280px;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    .formfield input {
      transition: none;
    }
  }
</style>
