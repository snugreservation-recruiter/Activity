<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login Layout Demo</title>

  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html {
      -webkit-text-size-adjust: 100%;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        Roboto, "Helvetica Neue", Arial, sans-serif;
      line-height: 1.5;
    }

    body {
      margin: 0;
      background: #fff;
      color: #1f2a37;
    }

    /* Center the design horizontally and vertically. */
    .page {
      display: flex;
      min-height: 100vh;
      min-height: 100svh;
      padding: 32px 16px;
    }

    .login-panel {
      width: 100%;
      max-width: 400px;
      margin: auto;
    }

    .branding {
      display: flex;
      justify-content: center;
      margin-bottom: 20px;
    }

    .brand-placeholder {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 180px;
      min-height: 64px;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      color: #374151;
      font-size: 1.4rem;
      font-weight: 700;
      letter-spacing: 0.04em;
    }

    h1 {
      margin: 0 0 12px;
      text-align: center;
      font-size: 1.25rem;
      font-weight: 700;
    }

    .demo-notice {
      margin: 0 0 24px;
      color: #5b6b7c;
      font-size: 0.85rem;
      text-align: center;
    }

    .formfield {
      margin-bottom: 18px;
    }

    .formfield label {
      display: block;
      margin-bottom: 6px;
      color: #374151;
      font-size: 0.85rem;
      font-weight: 700;
    }

    .formfield input {
      display: block;
      width: 100%;
      min-width: 0;
      padding: 10px 12px;
      border: 1px solid #63b3ed;
      border-radius: 6px;
      background: #fff;
      color: #1f2a37;
      font: inherit;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }

    .formfield input:focus {
      border-color: #2b8fd6;
      box-shadow: 0 0 0 3px rgb(99 179 237 / 25%);
    }

    .formfield input::placeholder {
      color: #94a3b8;
      opacity: 1;
    }

    .remember-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 4px;
    }

    .remember-row input {
      width: 16px;
      height: 16px;
      margin: 0;
      accent-color: #363535;
    }

    .remember-row label {
      color: #374151;
      font-size: 0.9rem;
      font-weight: 700;
    }

    .help {
      margin: 12px 0 0;
      color: #5b6b7c;
      font-size: 0.8rem;
    }

    .submit-button {
      display: block;
      width: 100%;
      margin: 20px 0 16px;
      padding: 12px 16px;
      border: none;
      border-radius: 8px;
      background: #363535;
      color: #fff;
      font: inherit;
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .submit-button:disabled {
      cursor: not-allowed;
      opacity: 0.65;
    }

    .self-care {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 8px;
    }

    .link-placeholder {
      color: #5b6b7c;
      font-size: 0.9rem;
      text-decoration: underline;
      text-underline-offset: 2px;
    }

    footer {
      margin-top: 28px;
      color: #64748b;
      font-size: 0.75rem;
      text-align: center;
    }

    @media (max-width: 480px) {
      .page {
        padding: 24px 16px;
      }

      .login-panel {
        max-width: 100%;
      }
    }
  </style>
</head>

<body>
  <main class="page">
    <section class="login-panel" aria-labelledby="login-heading">
      <header>
        <div class="branding">
          <div class="brand-placeholder">DEMO</div>
        </div>

        <h1 id="login-heading">Please log in</h1>

        <p class="demo-notice" id="demo-notice">
          Design preview only. Do not enter real credentials.
          Nothing is submitted or stored.
        </p>
      </header>

      <!--
        Static design only:
        No form submission, JavaScript, tracking, or external services.
      -->
      <div role="group" aria-describedby="demo-notice">
        <div class="formfield">
          <label for="demo-username">Username</label>
          <input
            id="demo-username"
            type="text"
            value="demo@example.test"
            readonly
          >
        </div>

        <div class="formfield">
          <label for="demo-password">Password</label>
          <input
            id="demo-password"
            type="password"
            value="demo-only"
            readonly
          >
        </div>

        <div class="remember-row">
          <input id="remember-me" type="checkbox" checked disabled>
          <label for="remember-me">Remember Me</label>
        </div>

        <p class="help">
          Remember Me is shown for layout purposes only.
        </p>

        <button class="submit-button" type="button" disabled>
          Submit
        </button>
      </div>

      <div class="self-care" aria-label="Design-only account options">
        <span class="link-placeholder">Need to register?</span>
        <span class="link-placeholder">Forgot Password?</span>
      </div>

      <footer>
        Static HTML and CSS demonstration
      </footer>
    </section>
  </main>
</body>
</html>
